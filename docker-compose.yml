version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - gradhire

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://gradhire:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/gradhire
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - REDIS_URL=redis://redis:6379
      - AI_PROVIDER=gemini
      - AI_FALLBACK_PROVIDER=groq
      - GEMINI_API_KEY=${GEMINI_API_KEY:-change-me-in-production}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GEMINI_TEMPERATURE=0.7
      - GEMINI_MAX_TOKENS=8192
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=gpt-4o-mini
      - OPENAI_BASE_URL=
      - OPENAI_TEMPERATURE=0.7
      - OPENAI_MAX_TOKENS=8192
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - GROQ_TEMPERATURE=0.7
      - GROQ_MAX_TOKENS=8192
      - OLLAMA_BASE_URL=http://localhost:11434
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_TEMPERATURE=0.7
      - OLLAMA_MAX_TOKENS=8192
      - SMTP_HOST=${SMTP_HOST:-smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-gradhire@example.com}
      - SMTP_PASS=${SMTP_PASS:-change-me-in-production}
      - SMTP_FROM=${SMTP_FROM:-GradTure <gradhire@example.com>}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gradhire

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=gradhire
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gradhire}
      - POSTGRES_DB=gradhire
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradhire"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gradhire

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gradhire

volumes:
  postgres_data:
  redis_data:

networks:
  gradhire:
    driver: bridge
