name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gradhire_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run frontend type check
        working-directory: frontend
        run: npm run build

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Run backend type check
        working-directory: backend
        run: npm run build

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/gradhire_test

      - name: Run backend unit tests
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/gradhire_test

      - name: Security audit - frontend
        working-directory: frontend
        run: npm audit --audit-level=moderate || true

      - name: Security audit - backend
        working-directory: backend
        run: npm audit --audit-level=moderate || true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gradhire_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/gradhire_e2e

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        shell: bash
        run: |
          (cd ../backend && DATABASE_URL=postgresql://postgres@localhost:5432/gradhire_e2e JWT_SECRET=e2e-secret-for-tests-only PORT=3000 nohup npm run start:dev > /tmp/backend.log 2>&1 &)
          npx wait-on http://localhost:3000/api/v1/health --timeout 90000
          API_BASE_URL=http://localhost:3000/api/v1 CI=true npm run test:e2e
        env:
          CI: true

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: gradture/frontend:${{ github.sha }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: gradture/backend:${{ github.sha }}

  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gradhire
          POSTGRES_PASSWORD: gradhire
          POSTGRES_DB: gradhire
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://gradhire:gradhire@localhost:5432/gradhire

      - name: Start backend
        working-directory: backend
        run: |
          set JWT_SECRET=test-secret-for-unit-tests-only
          set DATABASE_URL=postgresql://gradhire:gradhire@localhost:5432/gradhire
          npm run start:dev &
        env:
          JWT_SECRET: test-secret-for-unit-tests-only
          DATABASE_URL: postgresql://gradhire:gradhire@localhost:5432/gradhire
        shell: bash

      - name: Wait for backend
        run: npx wait-on http://localhost:3000/api/v1/health --timeout 60000

      - name: Run k6 load tests
        uses: grafana/k6-action@v0.3.0
        with:
          filename: load-tests/health.js

      - name: Run k6 jobs load test
        uses: grafana/k6-action@v0.3.0
        with:
          filename: load-tests/jobs.js

      - name: Run k6 companies load test
        uses: grafana/k6-action@v0.3.0
        with:
          filename: load-tests/companies.js
